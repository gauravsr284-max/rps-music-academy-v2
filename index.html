<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPS Music Talim Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.92)), url('https://images.unsplash.com/photo-1571536802807-30551f39f375?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-white min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      const [role, setRole] = React.useState('home');
      const [notices, setNotices] = React.useState(['RPS Music Talim Academy - Kashi. Naye batches shuru hain!']);
      const [newNotice, setNewNotice] = React.useState('');
      
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [pass, setPass] = React.useState('');

      // Media Management States
      const [photos, setPhotos] = React.useState([
        'https://images.unsplash.com/photo-1571536802807-30551f39f375?auto=format&fit=crop&w=800&q=80'
      ]);
      const [newPhotoUrl, setNewPhotoUrl] = React.useState('');

      const [videos, setVideos] = React.useState([
        { id: 1, title: 'Tabla Solo Performance', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }
      ]);
      const [newVideoTitle, setNewVideoTitle] = React.useState('');
      const [newVideoUrl, setNewVideoUrl] = React.useState('');

      const [isTeacher, setIsTeacher] = React.useState(false);
      const [tSub, setTSub] = React.useState('Tabla');
      const [tPhone, setTPhone] = React.useState('');
      const [tPass, setTPass] = React.useState('');
      const [agreed, setAgreed] = React.useState(false);

      const [students, setStudents] = React.useState([
        { id: 1, name: 'Tabla Student', sub: 'Tabla', phone: '9876543210' },
        { id: 2, name: 'Sitar Student', sub: 'Sitar', phone: '9123456789' },
        { id: 3, name: 'Guitar Student', sub: 'Guitar', phone: '9988776655' },
        { id: 4, name: 'Piano / Harmonium Student', sub: 'Piano / Harmonium', phone: '9811223344' },
        { id: 5, name: 'Vocal Student', sub: 'Vocal', phone: '9722334455' }
      ]);
      const [matText, setMatText] = React.useState('');
      const [selStu, setSelStu] = React.useState(1);

      const [approved, setApproved] = React.useState(false);
      const [inCall, setInCall] = React.useState(false);
      const [msgText, setMsgText] = React.useState('');
      const [adminMsgs, setAdminMsgs] = React.useState([]);

      const formatVideoUrl = (url) => {
        if(url.includes('watch?v=')) {
          return url.replace('watch?v=', 'embed/');
        }
        return url;
      };

      return (
        <div className="min-h-screen text-white font-sans pb-10">
          <div className="bg-yellow-500 text-gray-900 py-1 px-2 text-center font-bold text-xs">
            <marquee>{notices.join(" || ")}</marquee>
          </div>

          <header className="bg-gray-900/90 border-b border-gray-700 p-3 flex justify-between items-center flex-wrap gap-2">
            <div>
              <h1 className="text-xs font-bold text-yellow-400">RPS Music Talim Academy</h1>
              <p className="text-[9px] text-gray-300">Founder: Swargiya Rajani Priya Ji | Kashi</p>
            </div>
            <div className="flex gap-1 text-xs">
              <button onClick={() => setRole('home')} className={`px-2 py-1 rounded ${role==='home'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Home</button>
              <button onClick={() => setRole('student')} className={`px-2 py-1 rounded ${role==='student'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Student</button>
              <button onClick={() => setRole('teacher')} className={`px-2 py-1 rounded ${role==='teacher'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Teacher</button>
              <button onClick={() => setRole('admin')} className={`px-2 py-1 rounded ${role==='admin'?'bg-red-500 text-white font-bold':'bg-gray-800'}`}>Admin</button>
            </div>
          </header>

          <main className="max-w-md mx-auto p-3 space-y-3 text-xs">
            {role === 'home' && (
              <div className="space-y-3">
                <div className="bg-gray-900/90 border border-yellow-600/50 rounded-xl p-4 text-center space-y-3">
                  <h2 className="text-sm font-bold text-yellow-400">Banaras Gharana Music Center</h2>
                  <p className="text-[10px] text-gray-200">Sitar, Tabla, Guitar, Piano/Harmonium & Vocal Training.</p>
                  <div className="space-y-1 text-[11px] text-left bg-gray-800 p-2.5 rounded">
                    <p className="font-bold text-yellow-300">Fee Structure:</p>
                    <p>🇮🇳 Indian: ₹1,500 - ₹3,000 / month</p>
                    <p>🌍 Foreign: $60 - $120 / month</p>
                  </div>
                  <a href="https://docs.google.com/forms/d/e/1FAIpQLSf0LnUDfFoRV8BWZFwrqTOB75QaOUamDQqoOqdCwAwLF98kxQ/viewform" target="_blank" rel="noreferrer" className="block bg-yellow-500 text-gray-900 px-3 py-2 rounded-full font-bold">
                    Register via Google Form
                  </a>
                </div>

                <div className="bg-gray-900/90 border border-yellow-500/40 rounded-xl p-3 space-y-2">
                  <h3 className="font-bold text-yellow-400 text-xs text-center">Academy Performance Videos</h3>
                  {videos.map(v => (
                    <div key={v.id} className="space-y-1 bg-gray-800 p-2 rounded">
                      <p className="font-bold text-[11px] text-yellow-300">{v.title}</p>
                      <div className="rounded-lg overflow-hidden h-40 border border-gray-700">
                        <iframe src={v.url} className="w-full h-full" allowFullScreen></iframe>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-gray-900/90 border border-yellow-500/40 rounded-xl p-3 space-y-2">
                  <h3 className="font-bold text-yellow-400 text-xs text-center">Academy Gallery Photos</h3>
                  <div className="space-y-2">
                    {photos.map((p, idx) => (
                      <div key={idx} className="rounded-lg overflow-hidden h-40 border border-gray-700">
                        <img src={p} alt="Academy Gallery" className="w-full h-full object-cover" />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {role === 'student' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-3">
                <h2 className="text-sm font-bold text-yellow-400">Student Portal</h2>
                <div className="bg-gray-800 p-2.5 rounded space-y-2">
                  <p className="font-bold text-yellow-300">Live Video Class:</p>
                  {!approved ? (
                    <button onClick={() => alert('Request sent!')} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Request Admin to Connect</button>
                  ) : !inCall ? (
                    <button onClick={() => setInCall(true)} className="w-full bg-green-600 text-white font-bold p-1.5 rounded">Join Live Class</button>
                  ) : (
                    <div className="space-y-2">
                      <iframe src="https://meet.jit.si/RPSMusicAcademyLive" className="w-full h-36 border-0 rounded" allow="camera;microphone;fullscreen"></iframe>
                      <button onClick={() => setInCall(false)} className="w-full bg-red-600 font-bold p-1 rounded">Leave Class</button>
                    </div>
                  )}
                </div>
                <div className="bg-gray-800 p-2 rounded space-y-1">
                  <p className="font-bold text-yellow-300">Study Material (Admin sent):</p>
                  <p className="text-[11px] bg-gray-900 p-2 rounded text-gray-200">📚 Notes: Tabla Beats & Alankars</p>
                </div>
                <div className="bg-gray-800 p-2.5 rounded space-y-2">
                  <p className="font-bold text-yellow-300">Private Message to Admin:</p>
                  <textarea rows="2" value={msgText} onChange={e => setMsgText(e.target.value)} placeholder="Message..." className="w-full bg-gray-900 p-2 rounded text-white"></textarea>
                  <button onClick={() => { if(msgText) { setAdminMsgs([...adminMsgs, msgText]); setMsgText(''); alert('Sent!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Send to Admin</button>
                </div>
              </div>
            )}

            {role === 'teacher' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-3">
                <h2 className="text-sm font-bold text-yellow-400">Teacher Room & Login</h2>
                {!isTeacher ? (
                  <div className="bg-gray-800 p-2.5 rounded space-y-2">
                    <select value={tSub} onChange={e => setTSub(e.target.value)} className="w-full bg-gray-900 p-2 rounded text-white text-xs">
                      <option value="Tabla">Tabla Teacher</option>
                      <option value="Sitar">Sitar Teacher</option>
                      <option value="Guitar">Guitar Teacher</option>
                      <option value="Piano / Harmonium">Piano / Harmonium Teacher</option>
                      <option value="Vocal">Vocal Teacher</option>
                    </select>
                    <input type="text" value={tPhone} onChange={e => setTPhone(e.target.value)} placeholder="WhatsApp Number" className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                    <input type="password" value={tPass} onChange={e => setTPass(e.target.value)} placeholder="Teacher Code (5678)" className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                    <div className="bg-red-950/50 border border-red-500 p-2 rounded text-[10px]">
                      <p className="font-bold text-red-400">T&C:</p>
                      <p>• Referral: 97% | Normal: 60%</p>
                      <label className="flex items-center gap-1 pt-1 font-bold text-yellow-300">
                        <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} /> Accept T&C
                      </label>
                    </div>
                    <button onClick={() => {
                      if(!tPhone) { alert('WhatsApp number bharein!'); return; }
                      if(!agreed) { alert('T&C accept karein!'); return; }
                      if(tPass === '5678') setIsTeacher(true); else alert('Wrong Code (5678)');
                    }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Enter {tSub} Room</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="bg-green-900/40 p-2 rounded text-green-300 text-xs">✔ {tSub} Teacher Portal Active</div>
                    <div className="bg-gray-800 p-3 rounded space-y-2">
                      <p className="font-bold text-yellow-300 text-xs">Aapke Department ke Students:</p>
                      {students.filter(s => s.sub === tSub).map(s => (
                        <div key={s.id} className="bg-gray-900 p-1.5 rounded flex justify-between text-[11px]">
                          <span>👤 {s.name}</span><span className="text-yellow-400">{s.phone}</span>
                        </div>
                      ))}
                      <p className="text-[10px] text-gray-400">Total Students: {students.filter(s => s.sub === tSub).length}</p>
                    </div>
                    <button onClick={() => { setApproved(true); alert('Class started for students!'); }} className="w-full bg-green-600 text-white font-bold p-1.5 rounded">Start Class</button>
                  </div>
                )}
              </div>
            )}

            {role === 'admin' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-red-500 space-y-3">
                <h2 className="text-sm font-bold text-red-400">Admin Dashboard</h2>
                {!isAdmin ? (
                  <div className="space-y-2">
                    <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Password (1234)" className="w-full bg-gray-800 p-2 rounded text-white text-xs" />
                    <button onClick={() => { if(pass === '1234') setIsAdmin(true); else alert('Wrong!'); }} className="w-full bg-red-600 font-bold p-1.5 rounded">Login</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="bg-green-900/40 p-2 rounded text-green-300 text-xs">✔ Admin Verified</div>
                    
                    <div className="bg-gray-800 p-2.5 rounded space-y-2">
                      <p className="font-bold text-yellow-300 text-[11px]">Add New Video Clip:</p>
                      <input type="text" value={newVideoTitle} onChange={e => setNewVideoTitle(e.target.value)} placeholder="Video Title..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                      <input type="text" value={newVideoUrl} onChange={e => setNewVideoUrl(e.target.value)} placeholder="YouTube Embed / Direct URL..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                      <button onClick={() => {
                        if(newVideoTitle && newVideoUrl) {
                          setVideos([...videos, { id: Date.now(), title: newVideoTitle, url: formatVideoUrl(newVideoUrl) }]);
                          setNewVideoTitle(''); setNewVideoUrl(''); alert('Video added!');
                        }
                      }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1 rounded">Add Video</button>
                      
                      <div className="pt-2 space-y-1">
                        <p className="text-[10px] text-gray-300 font-bold">Manage Existing Videos:</p>
                        {videos.map(v => (
                          <div key={v.id} className="flex justify-between items-center bg-gray-900 p-1.5 rounded text-[10px]">
                            <span className="truncate w-36">{v.title}</span>
                            <button onClick={() => setVideos(videos.filter(item => item.id !== v.id))} className="bg-red-600 px-2 py-0.5 rounded text-white font-bold">Delete</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="bg-gray-800 p-2.5 rounded space-y-2">
                      <p className="font-bold text-yellow-300 text-[11px]">Add Gallery Photo URL:</p>
                      <input type="text" value={newPhotoUrl} onChange={e => setNewPhotoUrl(e.target.value)} placeholder="Direct Image URL..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                      <button onClick={() => {
                        if(newPhotoUrl) {
                          setPhotos([...photos, newPhotoUrl]);
                          setNewPhotoUrl(''); alert('Photo added to gallery!');
                        }
                      }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1 rounded">Add Photo</button>
                      
                      <div className="pt-2 space-y-1">
                        <p className="text-[10px] text-gray-300 font-bold">Manage Gallery Photos:</p>
                        {photos.map((p, idx) => (
                          <div key={idx} className="flex justify-between items-center bg-gray-900 p-1.5 rounded text-[10px]">
                            <span className="truncate w-36">Photo #{idx+1}</span>
                            <button onClick={() => setPhotos(photos.filter((_, i) => i !== idx))} className="bg-red-600 px-2 py-0.5 rounded text-white font-bold">Delete</button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <button onClick={() => { setApproved(true); alert('Class Connected!'); }} className="w-full bg-green-600 font-bold p-1.5 rounded">Approve & Connect Class</button>
                    <div className="bg-gray-800 p-2.5 rounded space-y-2">
                      <p className="font-bold text-yellow-300 text-[11px]">Send Study Material to Student:</p>
                      <select value={selStu} onChange={e => setSelStu(Number(e.target.value))} className="w-full bg-gray-900 p-2 rounded text-white text-xs">
                        {students.map(s => <option key={s.id} value={s.id}>{s.name} ({s.sub})</option>)}
                      </select>
                      <input type="text" value={matText} onChange={e => setMatText(e.target.value)} placeholder="Material note..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                      <button onClick={() => { if(matText) { setMatText(''); alert('Material sent!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold p-1 rounded">Send Material</button>
                    </div>
                    <div className="bg-gray-800 p-2 rounded space-y-1">
                      <p className="font-bold text-yellow-300 text-[11px]">Student Messages:</p>
                      {adminMsgs.length === 0 ? <p className="text-gray-400 text-[10px]">No messages.</p> : adminMsgs.map((m, i) => <div key={i} className="text-[10px] bg-gray-900 p-1 rounded">👤 {m}</div>)}
                    </div>
                    <input type="text" value={newNotice} onChange={e => setNewNotice(e.target.value)} placeholder="Publish notice..." className="w-full bg-gray-800 p-2 rounded text-white text-xs" />
                    <button onClick={() => { if(newNotice) { setNotices([newNotice, ...notices]); setNewNotice(''); alert('Published!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Publish Notice</button>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
  </html>
