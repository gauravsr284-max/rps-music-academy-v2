<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPS Music Talim Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.8), rgba(15, 23, 42, 0.9)), url('https://images.unsplash.com/photo-1571536802807-30551f39f375?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-white min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      const [role, setRole] = React.useState('home');
      const [notices, setNotices] = React.useState(['RPS Music Talim Academy - Kashi. Naye batches shuru hain!']);
      const [newNotice, setNewNotice] = React.useState('');
      
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [pass, setPass] = React.useState('');

      const [visitorName, setVisitorName] = React.useState('');
      const [visitorPhone, setVisitorPhone] = React.useState('');
      const [visitorQuery, setVisitorQuery] = React.useState('');
      const [visitorInquiries, setVisitorInquiries] = React.useState([]);

      const [photos, setPhotos] = React.useState([
        'https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=800&q=80'
      ]);
      const [newPhotoUrl, setNewPhotoUrl] = React.useState('');

      const [videos, setVideos] = React.useState([
        { id: 1, title: 'Banaras Gharana Tabla Solo (Motivation)', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ' }
      ]);
      const [newVideoTitle, setNewVideoTitle] = React.useState('');
      const [newVideoUrl, setNewVideoUrl] = React.useState('');

      const [isTeacher, setIsTeacher] = React.useState(false);
      const [tSub, setTSub] = React.useState('Tabla');
      const [tPhone, setTPhone] = React.useState('');
      const [tPass, setTPass] = React.useState('');
      const [agreed, setAgreed] = React.useState(false);

      const [students, setStudents] = React.useState([
        { id: 1, name: 'Tabla Student', sub: 'Tabla', phone: '9876543210' },
        { id: 2, name: 'Sitar Student', sub: 'Sitar', phone: '9123456789' },
        { id: 3, name: 'Guitar Student', sub: 'Guitar', phone: '9988776655' },
        { id: 4, name: 'Piano / Harmonium Student', sub: 'Piano / Harmonium', phone: '9811223344' },
        { id: 5, name: 'Vocal Student', sub: 'Vocal', phone: '9722334455' }
      ]);

      const [studyMaterials, setStudyMaterials] = React.useState([
        { id: 1, sub: 'Tabla', title: 'Tabla Basic Beats PDF', link: '#' }
      ]);
      const [matTitle, setMatTitle] = React.useState('');
      const [matLink, setMatLink] = React.useState('');

      const [approved, setApproved] = React.useState(false);
      const [inCall, setInCall] = React.useState(false);
      const [msgText, setMsgText] = React.useState('');
      const [adminMsgs, setAdminMsgs] = React.useState([]);

      const [tReportText, setTReportText] = React.useState('');
      const [teacherReports, setTeacherReports] = React.useState([]);

      const formatVideoUrl = (url) => {
        if(url.includes('watch?v=')) {
          return url.replace('watch?v=', 'embed/');
        }
        return url;
      };

      const shareWebsite = () => {
        if (navigator.share) {
          navigator.share({
            title: 'RPS Music Talim Academy',
            text: 'Banaras Gharana se Sitar, Tabla, Guitar aur Vocal ki shiksha ke liye judein!',
            url: window.location.href,
          }).catch(() => {});
        } else {
          prompt('Website Link copy karein:', window.location.href);
        }
      };

      return (
        <div className="min-h-screen text-white font-sans pb-10">
          <div className="bg-yellow-500 text-gray-900 py-1 px-2 text-center font-bold text-xs">
            <marquee>{notices.join(" || ")}</marquee>
          </div>

          <header className="bg-gray-900/90 border-b border-gray-700 p-3 flex justify-between items-center flex-wrap gap-2">
            <div>
              <h1 className="text-xs font-bold text-yellow-400">RPS Music Talim Academy</h1>
              <p className="text-[9px] text-gray-300">Founder: Swargiya Rajani Priya Ji | Kashi</p>
            </div>
            <div className="flex gap-1 text-xs">
              <button onClick={() => setRole('home')} className={`px-2 py-1 rounded ${role==='home'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Home</button>
              <button onClick={() => setRole('student')} className={`px-2 py-1 rounded ${role==='student'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Student</button>
              <button onClick={() => setRole('teacher')} className={`px-2 py-1 rounded ${role==='teacher'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Teacher</button>
              <button onClick={() => setRole('admin')} className={`px-2 py-1 rounded ${role==='admin'?'bg-red-500 text-white font-bold':'bg-gray-800'}`}>Admin</button>
            </div>
          </header>

          <main className="max-w-md mx-auto p-3 space-y-3 text-xs">
            {role === 'home' && (
              <div className="space-y-3">
                <div className="bg-gray-900/90 border border-yellow-600/50 rounded-xl p-4 text-center space-y-3">
                  <h2 className="text-sm font-bold text-yellow-400">Kashi Ghat - Banaras Gharana Music Center</h2>
                  <p className="text-[10px] text-gray-200">Sitar, Tabla, Guitar, Piano/Harmonium & Vocal Training.</p>
                  
                  <div className="space-y-1.5 text-[11px] text-left bg-gray-800 p-3 rounded">
                    <p className="font-bold text-yellow-300 text-center pb-1">Fee Structure & Admission</p>
                    <p>🇮🇳 <b>Domestic Students:</b></p>
                    <p className="pl-2">• Registration Fee: ₹99 (One-Time)</p>
                    <p className="pl-2">• Tabla Classes: ₹1,200 / month</p>
                    <p className="pl-2">• Other Instruments: ₹1,500 / month</p>
                    <hr className="border-gray-700 my-1"/>
                    <p>🌍 <b>Foreign Students:</b></p>
                    <p className="pl-2">• Tabla & Other Instruments: Standard Global Rates ($60 - $120 / month)</p>
                  </div>

                  <a href="https://docs.google.com/forms/d/e/1FAIpQLSf0LnUDfFoRV8BWZFwrqTOB75QaOUamDQqoOqdCwAwLF98kxQ/viewform" target="_blank" rel="noreferrer" className="block bg-yellow-500 text-gray-900 px-3 py-2 rounded-full font-bold">
                    Register via Google Form
                  </a>

                  <button onClick={shareWebsite} className="w-full bg-blue-600 text-white px-3 py-2 rounded-full font-bold flex items-center justify-center gap-1">
                    🔗 Invite Your Friend (Share Website)
                  </button>
                </div>

                <div className="bg-gray-900/90 border border-yellow-500/40 rounded-xl p-3 space-y-2">
                  <h3 className="font-bold text-yellow-400 text-xs text-center">Aapka Sawaal ya Requirement bhejein</h3>
                  <p className="text-[10px] text-gray-300 text-center">Humein batayein aapko kis tarah ki sangeet shiksha ya jankari chahiye.</p>
                  <div className="space-y-2 bg-gray-800 p-2.5 rounded">
                    <input type="text" value={visitorName} onChange={e => setVisitorName(e.target.value)} placeholder="Aapka Naam..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                    <input type="text" value={visitorPhone} onChange={e => setVisitorPhone(e.target.value)} placeholder="WhatsApp Number..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                    <textarea rows="2" value={visitorQuery} onChange={e => setVisitorQuery(e.target.value)} placeholder="Apna sawal ya requirement yahan likhein..." className="w-full bg-gray-900 p-2 rounded text-white text-xs"></textarea>
                    <button onClick={() => {
                      if(!visitorName || !visitorQuery) {
                        alert('Kripya naam aur apna sawal/requirement bharein!');
                        return;
                      }
                      setVisitorInquiries([...visitorInquiries, { name: visitorName, phone: visitorPhone, query: visitorQuery, time: new Date().toLocaleTimeString() }]);
                      setVisitorName(''); setVisitorPhone(''); setVisitorQuery('');
                      alert('Aapka sandesh Admin tak pahunch gaya hai. Dhanyawad!');
                    }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Send to Admin</button>
                  </div>
                </div>

                <div className="bg-gray-900/90 border border-yellow-500/40 rounded-xl p-3 space-y-2">
                  <h3 className="font-bold text-yellow-400 text-xs text-center">Motivational Tabla & Music Videos</h3>
                  {videos.map(v => (
                    <div key={v.id} className="space-y-1 bg-gray-800 p-2 rounded">
                      <p className="font-bold text-[11px] text-yellow-300">{v.title}</p>
                      <div className="rounded-lg overflow-hidden h-40 border border-gray-700">
                        <iframe src={v.url} className="w-full h-full" allowFullScreen></iframe>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="bg-gray-900/90 border border-yellow-500/40 rounded-xl p-3 space-y-2">
                  <h3 className="font-bold text-yellow-400 text-xs text-center">Maa Saraswati & Academy Gallery</h3>
                  <div className="space-y-2">
                    {photos.map((p, idx) => (
                      <div key={idx} className="rounded-lg overflow-hidden h-40 border border-gray-700">
                        <img src={p} alt="Maa Saraswati / Gallery" className="w-full h-full object-cover" />
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {role === 'student' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-3">
                <h2 className="text-sm font-bold text-yellow-400">Student Portal</h2>
                <div className="bg-gray-800 p-2.5 rounded space-y-2">
                  <p className="font-bold text-yellow-300">Live Video Class:</p>
                  {!approved ? (
                    <button onClick={() => alert('Request sent!')} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Request Admin to Connect</button>
                  ) : !inCall ? (
                    <button onClick={() => setInCall(true)} className="w-full bg-green-600 text-white font-bold p-1.5 rounded">Join Live Class</button>
                  ) : (
                    <div className="space-y-2">
                      <iframe src="https://meet.jit.si/RPSMusicAcademyLive" className="w-full h-36 border-0 rounded" allow="camera;microphone;fullscreen"></iframe>
                      <button onClick={() => setInCall(false)} className="w-full bg-red-600 font-bold p-1 rounded">Leave Class</button>
                    </div>
                  )}
                </div>

                <div className="bg-gray-800 p-2.5 rounded space-y-2">
                  <p className="font-bold text-yellow-300">Study Material & Notes (Teachers Uploaded):</p>
                  {studyMaterials.length === 0 ? (
                    <p className="text-gray-400 text-[10px]">Abhi koi study material uplabdh nahi hai.</p>
                  ) : (
                    studyMaterials.map((m) => (
                      <div key={m.id} className="bg-gray-900 p-2 rounded flex justify-between items-center text-[11px]">
                        <div>
                          <p className="font-bold text-yellow-400">📚 {m.title}</p>
                          <p className="text-[9px] text-gray-400">Subject: {m.sub}</p>
                        </div>
                        <a href={m.link !== '#' ? m.link : '#'} target="_blank" rel="noreferrer" onClick={(e) => { if(m.link === '#') { e.preventDefault(); alert('Yeh demo material hai.'); }}} className="bg-yellow-500 text-gray-900 px-2.5 py-1 rounded font-bold text-[10px]">
                          Download / View
                        </a>
                      </div>
                    ))
                  )}
                </div>

                <div className="bg-gray-800 p-2.5 rounded space-y-2">
                  <p className="font-bold text-yellow-300">Private Message to Admin:</p>
                  <textarea rows="2" value={msgText} onChange={e => setMsgText(e.target.value)} placeholder="Message..." className="w-full bg-gray-900 p-2 rounded text-white"></textarea>
                  <button onClick={() => { if(msgText) { setAdminMsgs([...adminMsgs, msgText]); setMsgText(''); alert('Sent!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Send to Admin</button>
                </div>
              </div>
            )}

            {role === 'teacher' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-3">
                <h2 className="text-sm font-bold text-yellow-400">Teacher Room & Login</h2>
                {!isTeacher ? (
                  <div className="bg-gray-800 p-2.5 rounded space-y-2">
                    <select value={tSub} onChange={e => setTSub(e.target.value)} className="w-full bg-gray-900 p-2 rounded text-white text-xs">
                      <option value="Tabla">Tabla Teacher</option>
                      <option value="Sitar">Sitar Teacher</option>
                      <option value="Guitar">Guitar Teacher</option>
                      <option value="Piano / Harmonium">Piano / Harmonium Teacher</option>
                      <option value="Vocal">Vocal Teacher</option>
                    </select>
                    <input type="text" value={tPhone} onChange={e => setTPhone(e.target.value)} placeholder="WhatsApp Number" className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                    <input type="password" value={tPass} onChange={e => setTPass(e.target.value)} placeholder="Teacher Code (5678)" className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                    <div className="bg-red-950/50 border border-red-500 p-2 rounded text-[10px] space-y-1">
                      <p className="font-bold text-red-400">T&C & Academy Rules:</p>
                      <p>• No anger/harassment with students allowed.</p>
                      <p>• Direct student se bahas/jawab nahi dena hai, student issue/requirement seedhe Admin ko batana hai.</p>
                      <p>• Koi bhi fraud many nahi hoga.</p>
                      <p>• Teacher aur student ke beech kisi bhi galat ya kanooni maamle ki zimmedari Academy ki nahi hogi.</p>
                      <p>• Referral: 97% | Normal: 60%</p>
                      <label className="flex items-center gap-1 pt-1 font-bold text-yellow-300">
                        <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} /> Accept T&C & Rules
                      </label>
                    </div>
                    <button onClick={() => {
                      if(!tPhone) { alert('WhatsApp number bharein!'); return; }
                      if(!agreed) { alert('T&C accept karein!'); return; }
                      if(tPass === '5678') setIsTeacher(true); else alert('Wrong Code (5678)');
                    }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Enter {tSub} Room</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="bg-green-900/40 p-2 rounded text-green-300 text-xs">✔ {tSub} Teacher Portal Active</div>
                    
                    <div className="bg-gray-800 p-3 rounded space-y-2">
                      <p className="font-bold text-yellow-300 text-xs">Aapke Department ke Students:</p>
                      {students.filter(s => s.sub === tSub).map(s => (
                        <div key={s.id} className="bg-gray-900 p-1.5 rounded flex justify-between text-[11px]">
                          <span>👤 {s.name}</span><span className="text-yellow-400">{s.phone}</span>
                        </div>
                      ))}
                      <p className="text-[10px] text-gray-400">Total Students: {students.filter(s => s.sub === tSub).length}</p>
                    </div>

                    <div className="bg-gray-800 p-2.5 rounded space-y-2 border border-yellow-600/40">
                      <p className="font-bold text-yellow-300 text-[11px]">Upload Study Material / PDF / Photo for Students:</p>
                      <input type="text" value={matTitle} onChange={e => setMatTitle(e.target.value)} placeholder="Material Title (jaise: Alankar PDF)..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                      <input type="text" value={matLink} onChange={e => setMatLink(e.target.value)} placeholder="Paste File / Google Drive / Image Link..." className="w-full bg-gray-900 p-2 rounded text-white text-xs" />
                      <button onClick={() => {
                        if(!matTitle || !matLink) { alert('Material title aur link dono bharein!'); return; }
                        setStudyMaterials([...studyMaterials, { id: Date.now(), sub: tSub, title: matTitle, link: matLink }]);
                        setMatTitle(''); setMatLink('');
                        alert('Study material safaltapurvak upload ho gaya hai!');
                      }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Upload Material</button>
                    </div>

                    <div className="bg-gray-800 p-2.5 rounded space-y-2 border border-yellow-600/40">
                      <p className="font-bold text-yellow-300 text-[11px]">Report Student Issue / Requirement to Admin:</p>
                      <textarea rows="2" value={tReportText} onChange={e => setTReportText(e.target.value)} placeholder="Student ka naam, kya bola/kiya ya requirement hai yahan likhein..." className="w-full bg-gray-900 p-2 rounded text-white text-xs"></textarea>
                      <button onClick={() => {
                        if(!tReportText) { alert('Kripya details bharein!'); return; }
                        setTeacherReports([...teacherReports, { sub: tSub, phone: tPhone, report: tReportText, time: new Date().toLocaleTimeString() }]);
                        setTReportText('');
                        alert('Report Admin tak bhej di gayi hai!');
                      }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Send Report to Admin</button>
                    </div>

                    <button onClick={() => { setApproved(true); alert('Class started for students!'); }} className="w-full bg-green-600 text-white font-bold p-1.5 rounded">Start Class</button>
                  </div>
                )}
              </div>
            )}

            {role === 'admin' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-red-500 space-y-3">
                <h2 className="text-sm font-bold text-red-400">Admin Dashboard</h2>
                {!isAdmin ? (
                  <div className="space-y-2">
                    <input type="password" va
