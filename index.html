<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPS Music Talim Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.88), rgba(15, 23, 42, 0.92)), url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [role, setRole] = React.useState('home');
      const [notices, setNotices] = React.useState(['RPS Music Talim Academy mein swagat hai! Banaras Gharana Tabla & Music Center.']);
      const [newNotice, setNewNotice] = React.useState('');
      
      // Daily Banner Image URL State (Roz alag image lagane ke liye)
      const [bannerImg, setBannerImg] = React.useState('https://images.unsplash.com/photo-1465847899084-d164df4dedc6?auto=format&fit=crop&w=800&q=80');
      const [newImgUrl, setNewImgUrl] = React.useState('');

      // Admin States
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [pass, setPass] = React.useState('');
      
      // Teacher Registration & Portal States
      const [isTeacherLoggedIn, setIsTeacherLoggedIn] = React.useState(false);
      const [teacherRegName, setTeacherRegName] = React.useState('');
      const [teacherRegPhone, setTeacherRegPhone] = React.useState('');
      const [teacherPass, setTeacherPass] = React.useState('');
      const [agreedTerms, setAgreedTerms] = React.useState(false);
      const [registeredTeachers, setRegisteredTeachers] = React.useState([]);

      // Live Class & Meeting States
      const [platform, setPlatform] = React.useState('jitsi');
      const [meetLink, setMeetLink] = React.useState('RPSMusicAcademyLive');
      const [approved, setApproved] = React.useState(false);
      const [inCall, setInCall] = React.useState(false);

      // Messages & Records (Student private msg -> Admin, Teacher broadcast -> All)
      const [studentMsgs, setStudentMsgs] = React.useState([]);
      const [msgText, setMsgText] = React.useState('');
      const [announcements, setAnnouncements] = React.useState(['Riyaz regular karein. - Teacher']);
      const [annText, setAnnText] = React.useState('');
      const [recLink, setRecLink] = React.useState('');
      const [recs, setRecs] = React.useState([]);

      return (
        <div className="min-h-screen text-white font-sans pb-12">
          {/* Notification Marquee Bar */}
          <div className="bg-yellow-500 text-gray-900 py-2 px-4 text-center font-bold text-xs shadow-md">
            <marquee>{notices.join(" || ")}</marquee>
          </div>

          {/* Header */}
          <header className="bg-gray-900/90 border-b border-gray-700 py-3 px-4 flex justify-between items-center flex-wrap gap-2 shadow-lg backdrop-blur">
            <div>
              <h1 className="text-sm font-bold text-yellow-400">RPS Music Talim Academy</h1>
              <p className="text-[10px] text-gray-300">Founder: Gaurav Srivastava | Kashi</p>
            </div>
            <div className="flex gap-1 text-xs">
              <button onClick={() => setRole('home')} className={`px-2 py-1 rounded ${role==='home'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Home</button>
              <button onClick={() => setRole('student')} className={`px-2 py-1 rounded ${role==='student'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Student</button>
              <button onClick={() => setRole('teacher')} className={`px-2 py-1 rounded ${role==='teacher'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Teacher</button>
              <button onClick={() => setRole('admin')} className={`px-2 py-1 rounded ${role==='admin'?'bg-red-500 text-white font-bold':'bg-gray-800'}`}>Admin</button>
            </div>
          </header>

          <main className="max-w-md mx-auto p-4 space-y-4 text-xs">
            
            {/* HOME SECTION */}
            {role === 'home' && (
              <div className="space-y-4">
                <div className="bg-gray-900/90 border border-yellow-600/50 rounded-xl p-4 text-center shadow-2xl space-y-3 backdrop-blur">
                  <h2 className="text-lg font-bold text-yellow-400">Banaras Gharana Tabla & Music Center</h2>
                  <p className="text-[11px] text-gray-200">Kashi ki pavitra dharti se Tabla, Sitar, Guitar & Harmonium ki professional training.</p>
                  
                  {/* Roz badalne wali image display */}
                  <div className="rounded-lg overflow-hidden h-40 border border-gray-700 shadow-inner">
                    <img src={bannerImg} alt="Music Academy Banner" className="w-full h-full object-cover" />
                  </div>

                  <a href="https://forms.gle/YOUR_GOOGLE_FORM" target="_blank" rel="noreferrer" className="block bg-yellow-500 text-gray-900 px-4 py-2.5 rounded-full font-bold shadow-lg hover:bg-yellow-400">
                    Register via Google Form
                  </a>
                </div>

                {/* FEE STRUCTURE (Indian & Foreign Alag-Alag) */}
                <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-3 shadow-lg backdrop-blur">
                  <h3 className="font-bold text-yellow-400 border-b border-gray-700 pb-1 text-center">Fee Structure (Indian & Foreign Students)</h3>
                  
                  <div className="space-y-2">
                    <p className="font-bold text-yellow-300">🇮🇳 Indian Students (INR):</p>
                    <div className="grid grid-cols-3 gap-2 text-center">
                      <div className="bg-gray-800 p-2 rounded border border-gray-700">
                        <p className="font-bold text-gray-300">Basic</p>
                        <p className="text-xs font-extrabold text-yellow-400 mt-1">₹1,500/mo</p>
                      </div>
                      <div className="bg-gray-800 p-2 rounded border border-yellow-500">
                        <p className="font-bold text-gray-300">Solo Tabla</p>
                        <p className="text-xs font-extrabold text-yellow-400 mt-1">₹2,500/mo</p>
                      </div>
                      <div className="bg-gray-800 p-2 rounded border border-gray-700">
                        <p className="font-bold text-gray-300">1-on-1</p>
                        <p className="text-xs font-extrabold text-yellow-400 mt-1">₹3,000/mo</p>
                      </div>
                    </div>
                  </div>

                  <div className="space-y-2 pt-2 border-t border-gray-800">
                    <p className="font-bold text-yellow-300">🌍 Foreign Students (International):</p>
                    <div className="grid grid-cols-2 gap-2 text-center">
                      <div className="bg-gray-800 p-2 rounded border border-gray-700">
                        <p className="font-bold text-gray-300">Group Class</p>
                        <p className="text-xs font-extrabold text-yellow-400 mt-1">$60 / Month</p>
                      </div>
                      <div className="bg-gray-800 p-2 rounded border border-yellow-500">
                        <p className="font-bold text-gray-300">1-on-1 Masterclass</p>
                        <p className="text-xs font-extrabold text-yellow-400 mt-1">$120 / Month</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* STUDENT PORTAL */}
            {role === 'student' && (
              <div className="bg-gray-900/90 rounded-lg p-4 border border-gray-700 space-y-3 shadow-lg backdrop-blur">
                <h2 className="text-base font-bold text-yellow-400">Student Portal</h2>

                {/* Teacher Announcements (Sabhi ko dikhega) */}
                <div className="bg-gray-800 p-3 rounded space-y-1 border border-gray-700">
                  <p className="font-bold text-yellow-300">Teacher Announcements:</p>
                  {announcements.map((a, i) => (
                    <div key={i} className="bg-gray-900 p-2 rounded text-gray-200 text-[11px]">📢 {a}</div>
                  ))}
                </div>

                {/* Live Video Class */}
                <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                  <p className="font-bold text-yellow-300">Live Video Class Integration</p>
                  
                  {!approved && (
                    <button onClick={() => alert('Request sent to Admin!')} className="bg-yellow-500 text-gray-900 font-bold px-3 py-2 rounded w-full">
                      Request Admin to Connect Class
                    </button>
                  )}

                  {approved && !inCall && (
                    <button onClick={() => setInCall(true)} className="bg-green-600 text-white font-bold px-3 py-2 rounded w-full">
                      Join Approved Class ({platform.toUpperCase()})
                    </button>
                  )}

                  {approved && inCall && (
                    <div className="space-y-2">
                      <div className="h-64 bg-black rounded overflow-hidden">
                        {platform === 'jitsi' ? (
                          <iframe src={`https://meet.jit.si/${meetLink}`} style={{width:'100%', height:'100%', border:0}} allow="camera;microphone;fullscreen"></iframe>
                        ) : (
                          <div className="flex flex-col items-center justify-center h-full p-4 text-center space-y-2">
                            <p className="text-yellow-400">Google Meet Link:</p>
                            <a href={`https://${meetLink}`} target="_blank" rel="noreferrer" className="bg-blue-600 text-white px-4 py-2 rounded font-bold">Open Google Meet</a>
                          </div>
                        )}
                      </div>
                      <button onClick={() => setInCall(false)} className="bg-red-600 text-white font-bold px-3 py-1 rounded w-full">Leave Class</button>
                    </div>
                  )}
                </div>

                {/* Private Message to Admin */}
                <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                  <p className="font-bold text-yellow-300">Private Message to Admin (Gaurav Srivastava):</p>
                  <textarea rows="2" value={msgText} onChange={e => setMsgText(e.target.value)} placeholder="Aapka message sirf Admin ko dikhega..." className="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white"></textarea>
                  <button onClick={() => { if(msgText) { setStudentMsgs([...studentMsgs, {text: msgText, sender: 'Student'}]); setMsgText(''); alert('Message sent securely to Admin!'); }}} className="bg-yellow-500 text-gray-900 font-bold px-3 py-1.5 rounded w-full">Send Privately to Admin</button>
                </div>
              </div>
            )}

            {/* TEACHER PORTAL & REGISTRATION */}
            {role === 'teacher' && (
              <div className="bg-gray-900/90 rounded-lg p-4 border border-gray-700 space-y-3 shadow-lg backdrop-blur">
                <h2 className="text-base font-bold text-yellow-400">Teacher Dashboard & Registration</h2>
                
                {!isTeacherLoggedIn ? (
                  <div className="bg-gray-800 p-3 rounded space-y-3 border border-gray-700">
                    <p className="font-bold text-yellow-300">Teacher Registration & Login:</p>
                    <input type="text" value={teacherRegName} onChange={e => setTeacherRegName(e.target.value)} placeholder="Full Name..." className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700" />
                    <input type="text" value={teacherRegPhone} onChange={e => setTeacherRegPhone(e.target.value)} placeholder="WhatsApp Number..." className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700" />
                    <input type="password" value={teacherPass} onChange={e => setTeacherPass(e.target.value)} placeholder="Teacher Code (e.g. 5678)" className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700" />
                    
                    {/* Terms & Conditions Box */}
                    <div className="bg-red-950/40 border border-red-500 p-2.5 rounded space-y-1 text-[10px] text-gray-200">
                      <p className="font-bold text-red-400">Terms & Conditions:</p>
                      <p>1. Referral students fee: 97% Teacher / 3% Academy.</p>
                      <p>2. Normal academy students fee: 60% Teacher / 40% Academy.</p>
                      <p>3. Har class ki recording admin ko submit karni anivarya hai.</p>
                      <label className="flex items-center gap-2 pt-1 font-bold cursor-pointer text-yellow-300">
                        <input type="checkbox" checked={agreedTerms} onChange={e => setAgreedTerms(e.target.checked)} />
                        Maine saari Terms & Conditions padh li hain aur manzoor karta hoon.
                      </label>
                    </div>

                    <button onClick={() => {
                      if(!teacherRegName || !teacherRegPhone) { alert('Naam aur phone number bharein!'); return; }
                      if(!agreedTerms) { alert('Terms & Conditions accept karna anivarya hai!'); return; }
                      if(teacherPass === '5678') {
                        setIsTeacherLoggedIn(true);
                        setRegisteredTeachers([...registeredTeachers, {name: teacherRegName, phone: teacherRegPhone}]);
                        alert('Teacher Registration & Login Successful!');
                      } else {
                        alert('Galat Teacher Code hai! (Code: 5678 daalein)');
                      }
                    }} className="w-full bg-yellow-500 text-gray-900 font-bold py-2 rounded shadow">Register & Login</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="bg-green-950/60 p-2 rounded text-green-300 border border-green-600">✔ Teacher Verified ({teacherRegName})</div>
                    
                    <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                      <p className="font-bold text-yellow-300">Broadcast Announcement to Students:</p>
                      <input type="text" value={annText} onChange={e => setAnnText(e.target.value)} placeholder="Message likhein jo sabhi students ko dikhega..." className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700" />
                      <button onClick={() => { if(annText) { setAnnouncements([annText, ...announcements]); setAnnText(''); alert('Broadcasted to all students!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold py-1.5 rounded">Broadcast to All</button>
                    </div>

                    <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                      <p className="font-bold text-yellow-300">Submit Class Recording Link to Admin:</p>
                      <input type="text" value={recLink} onChange={e => setRecLink(e.target.value)} placeholder="Google Drive / YouTube link..." className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700" />
                      <button onClick={() => { if(recLink) { setRecs([...recs, {teacher: teacherRegName, link: recLink}]); setRecLink(''); alert('Recording submitted successfully to Admin!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold py-1.5 rounded">Submit Recording</button>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ADMIN PORTAL */}
            {role === 'admin' && (
              <div className="bg-gray-900/90 rounded-lg p-4 border border-red-500 space-y-3 shadow-lg backdrop-blur">
                <h2 className="text-base font-bold text-red-400">Admin Private Dashboard</h2>
                {!isAdmin ? (
                  <div className="space-y-2">
                    <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Admin Password (1234)" className="w-full bg-gray-800 p-2 rounded border border-gray-700 text-white" />
                    <button onClick={() => { if(pass === '1234') setIsAdmin(true); else alert('Wrong password!'); }} className="bg-red-600 font-bold w-full py-2 rounded text-white shadow">Login</button>
                  </div>
                ) : (
                  <div className="space-y-3">
                    <div className="bg-green-950/60 p-2 rounded text-green-300 border border-green-600">✔ Admin Access Verified (Gaurav Srivastava)</div>
                    
                    {/* Roz Image / Banner Badalne ka Option */}
                    <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                      <p className="font-bold text-yellow-300">Change Daily Home Banner Image (URL):</p>
                      <input type="text" value={newImgUrl} onChange={e => setNewImgUrl(e.target.value)} placeholder="Nai image ka Direct URL yahan paste karein..." className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700" />
                      <button onClick={() => { if(newImgUrl) { setBannerImg(newImgUrl); setNewImgUrl(''); alert('Home banner image updated successfully!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold py-1.5 rounded">Update Banner Image</button>
                    </div>

                    <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                      <p className="font-bold text-yellow-300">Manage Live Class Connection:</p>
                      <select value={platform} onChange={e => setPlatform(e.target.value)} className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700">
                        <option value="jitsi">Jitsi Meet (Free)</option>
                        <option value="google">Google Meet</option>
                      </select>
                      <input type="text" value={meetLink} onChange={e => setMeetLink(e.target.value)} className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700" />
                      <button onClick={() => { setApproved(true); alert('Class connected for students!'); }} className="bg-green-600 font-bold px-3 py-1.5 rounded text-white w-full">Approve & Connect Class</button>
                    </div>

                    {/* Student Private Messages (Sirf Admin ko dikhega) */}
                    <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                      <p className="font-bold text-yellow-300">Student Private Messages:</p>
                      {studentMsgs.length === 0 ? <p className="text-gray-400">No private messages yet.</p> : studentMsgs.map((m, i) => (
                        <div key={i} className="bg-gray-900 p-2 rounded text-white text-[11px] border border-gray-700">👤 {m.text}</div>
                      ))}
                    </div>

                    {/* Registered Teachers List */}
                    <div className="bg-gray-800 p-3 rounded space-y-2 border border-gray-700">
                      <p className="font-bold text-yellow-300">Registered Teachers:</p>
                      {registeredTeachers.
