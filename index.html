<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPS Music Talim Academy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.95)), url('https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1000&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      const [role, setRole] = React.useState('home');
      const [notices, setNotices] = React.useState(['RPS Music Talim Academy - Banaras Gharana Kashi. Naye batches shuru hain!']);
      const [newNotice, setNewNotice] = React.useState('');
      
      const [isAdmin, setIsAdmin] = React.useState(false);
      const [pass, setPass] = React.useState('');
      
      const [isTeacherLoggedIn, setIsTeacherLoggedIn] = React.useState(false);
      const [tName, setTName] = React.useState('');
      const [tPhone, setTPhone] = React.useState('');
      const [tPass, setTPass] = React.useState('');
      const [agreed, setAgreed] = React.useState(false);

      const [approved, setApproved] = React.useState(false);
      const [inCall, setInCall] = React.useState(false);
      const [studentMsgs, setStudentMsgs] = React.useState([]);
      const [msgText, setMsgText] = React.useState('');
      const [announcements, setAnnouncements] = React.useState(['Riyaz regular karein.']);
      const [annText, setAnnText] = React.useState('');
      const [recLink, setRecLink] = React.useState('');
      const [recs, setRecs] = React.useState([]);

      return (
        <div className="min-h-screen text-white font-sans pb-12">
          <div className="bg-yellow-500 text-gray-900 py-1.5 px-2 text-center font-bold text-xs shadow">
            <marquee>{notices.join(" || ")}</marquee>
          </div>

          <header className="bg-gray-900/90 border-b border-gray-700 py-2.5 px-3 flex justify-between items-center flex-wrap gap-2 shadow">
            <div>
              <h1 className="text-xs font-bold text-yellow-400">RPS Music Talim Academy</h1>
              <p className="text-[9px] text-gray-300">Founder: Gaurav Srivastava | Kashi</p>
            </div>
            <div className="flex gap-1 text-[11px]">
              <button onClick={() => setRole('home')} className={`px-2 py-1 rounded ${role==='home'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Home</button>
              <button onClick={() => setRole('student')} className={`px-2 py-1 rounded ${role==='student'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Student</button>
              <button onClick={() => setRole('teacher')} className={`px-2 py-1 rounded ${role==='teacher'?'bg-yellow-500 text-gray-900 font-bold':'bg-gray-800'}`}>Teacher</button>
              <button onClick={() => setRole('admin')} className={`px-2 py-1 rounded ${role==='admin'?'bg-red-500 text-white font-bold':'bg-gray-800'}`}>Admin</button>
            </div>
          </header>

          <main className="max-w-md mx-auto p-3 space-y-3 text-xs">
            {role === 'home' && (
              <div className="space-y-3">
                <div className="bg-gray-900/90 border border-yellow-600/50 rounded-xl p-3 text-center shadow-xl space-y-2">
                  <h2 className="text-sm font-bold text-yellow-400">Banaras Gharana Tabla & Music Center</h2>
                  <p className="text-[10px] text-gray-200">Kashi se Tabla, Sitar, Guitar & Harmonium ki professional training.</p>
                  <a href="https://forms.gle/YOUR_GOOGLE_FORM" target="_blank" rel="noreferrer" className="block bg-yellow-500 text-gray-900 px-3 py-2 rounded-full font-bold shadow">
                    Register via Google Form
                  </a>
                </div>

                <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-2 shadow">
                  <h3 className="font-bold text-yellow-400 border-b border-gray-700 pb-1 text-center">Fee Structure</h3>
                  <div className="space-y-1 text-[11px]">
                    <p className="font-bold text-yellow-300">🇮🇳 Indian Students:</p>
                    <p>• Basic: ₹1,500/mo | Solo Tabla: ₹2,500/mo | 1-on-1: ₹3,000/mo</p>
                  </div>
                  <div className="space-y-1 text-[11px] pt-1 border-t border-gray-800">
                    <p className="font-bold text-yellow-300">🌍 Foreign Students:</p>
                    <p>• Group Class: $60/mo | 1-on-1 Masterclass: $120/mo</p>
                  </div>
                </div>
              </div>
            )}

            {role === 'student' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-3 shadow">
                <h2 className="text-sm font-bold text-yellow-400">Student Portal</h2>
                <div className="bg-gray-800 p-2.5 rounded space-y-1">
                  <p className="font-bold text-yellow-300">Teacher Announcements:</p>
                  {announcements.map((a, i) => <div key={i} className="text-gray-200 text-[11px]">📢 {a}</div>)}
                </div>

                <div className="bg-gray-800 p-2.5 rounded space-y-2">
                  <p className="font-bold text-yellow-300">Live Video Class</p>
                  {!approved ? (
                    <button onClick={() => alert('Request sent!')} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Request Admin to Connect Class</button>
                  ) : !inCall ? (
                    <button onClick={() => setInCall(true)} className="w-full bg-green-600 text-white font-bold p-1.5 rounded">Join Live Class</button>
                  ) : (
                    <div className="space-y-2">
                      <iframe src="https://meet.jit.si/RPSMusicAcademyLive" className="w-full h-40 border-0 rounded" allow="camera;microphone;fullscreen"></iframe>
                      <button onClick={() => setInCall(false)} className="w-full bg-red-600 font-bold p-1 rounded">Leave Class</button>
                    </div>
                  )}
                </div>

                <div className="bg-gray-800 p-2.5 rounded space-y-2">
                  <p className="font-bold text-yellow-300">Private Message to Admin:</p>
                  <textarea rows="2" value={msgText} onChange={e => setMsgText(e.target.value)} placeholder="Yahan likhein..." className="w-full bg-gray-900 p-2 rounded border border-gray-700 text-white text-xs"></textarea>
                  <button onClick={() => { if(msgText) { setStudentMsgs([...studentMsgs, msgText]); setMsgText(''); alert('Sent to Admin!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Send to Admin</button>
                </div>
              </div>
            )}

            {role === 'teacher' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-gray-700 space-y-3 shadow">
                <h2 className="text-sm font-bold text-yellow-400">Teacher Portal & Registration</h2>
                {!isTeacherLoggedIn ? (
                  <div className="bg-gray-800 p-2.5 rounded space-y-2">
                    <input type="text" value={tName} onChange={e => setTName(e.target.value)} placeholder="Full Name" className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700 text-xs" />
                    <input type="text" value={tPhone} onChange={e => setTPhone(e.target.value)} placeholder="WhatsApp Number" className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700 text-xs" />
                    <input type="password" value={tPass} onChange={e => setTPass(e.target.value)} placeholder="Teacher Code (5678)" className="w-full bg-gray-900 p-2 rounded text-white border border-gray-700 text-xs" />
                    <div className="bg-red-950/50 border border-red-500 p-2 rounded text-[10px] space-y-1">
                      <p className="font-bold text-red-400">Terms & Conditions:</p>
                      <p>• Referral: 97% Teacher / 3% Academy.</p>
                      <p>• Normal: 60% Teacher / 40% Academy.</p>
                      <label className="flex items-center gap-1.5 pt-1 font-bold text-yellow-300 cursor-pointer">
                        <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} /> Accept T&C
                      </label>
                    </div>
                    <button onClick={() => {
                      if(!tName || !tPhone) { alert('Naam aur phone bharein!'); return; }
                      if(!agreed) { alert('T&C accept karein!'); return; }
                      if(tPass === '5678') { setIsTeacherLoggedIn(true); alert('Logged in!'); }
                      else alert('Wrong Code! (5678)');
                    }} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Register & Login</button>
                  </div>
                ) : (
                  <div className="space-y-2">
                    <div className="bg-green-900/40 p-2 rounded text-green-300 text-xs">✔ Verified ({tName})</div>
                    <input type="text" value={annText} onChange={e => setAnnText(e.target.value)} placeholder="Broadcast message..." className="w-full bg-gray-800 p-2 rounded text-white border border-gray-700 text-xs" />
                    <button onClick={() => { if(annText) { setAnnouncements([annText, ...announcements]); setAnnText(''); alert('Broadcasted!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Broadcast</button>
                  </div>
                )}
              </div>
            )}

            {role === 'admin' && (
              <div className="bg-gray-900/90 rounded-lg p-3 border border-red-500 space-y-3 shadow">
                <h2 className="text-sm font-bold text-red-400">Admin Dashboard</h2>
                {!isAdmin ? (
                  <div className="space-y-2">
                    <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="Password (1234)" className="w-full bg-gray-800 p-2 rounded text-white border border-gray-700 text-xs" />
                    <button onClick={() => { if(pass === '1234') setIsAdmin(true); else alert('Wrong!'); }} className="w-full bg-red-600 font-bold p-1.5 rounded">Login</button>
                  </div>
                ) : (
                  <div className="space-y-2">
                    <div className="bg-green-900/40 p-2 rounded text-green-300 text-xs">✔ Admin Verified</div>
                    <button onClick={() => { setApproved(true); alert('Class Connected!'); }} className="w-full bg-green-600 font-bold p-1.5 rounded">Approve & Connect Class</button>
                    <div className="bg-gray-800 p-2 rounded space-y-1">
                      <p className="font-bold text-yellow-300 text-[11px]">Student Private Messages:</p>
                      {studentMsgs.length === 0 ? <p className="text-gray-400 text-[10px]">No messages.</p> : studentMsgs.map((m, i) => <div key={i} className="text-[10px] bg-gray-900 p-1 rounded">👤 {m}</div>)}
                    </div>
                    <input type="text" value={newNotice} onChange={e => setNewNotice(e.target.value)} placeholder="Publish notice..." className="w-full bg-gray-800 p-2 rounded text-white border border-gray-700 text-xs" />
                    <button onClick={() => { if(newNotice) { setNotices([newNotice, ...notices]); setNewNotice(''); alert('Published!'); }}} className="w-full bg-yellow-500 text-gray-900 font-bold p-1.5 rounded">Publish Notice</button>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
